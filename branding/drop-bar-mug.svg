<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <title>Coffee mug with drop-bar handle</title>
  <desc>48x48 icon of a coffee mug with a handle shaped like racing bike drop handlebars.</desc>

  <!-- Steam -->
  <g fill="none" stroke="#9a9a9a" stroke-width="1" stroke-linecap="round">
    <path d="M11 13 Q9 10 11 7 Q13 4 11 1"/>
    <path d="M17 12 Q19 9 17 6 Q15 3 17 0"/>
    <path d="M23 13 Q21 10 23 7 Q25 4 23 1"/>
  </g>

  <!-- Mug body -->
  <rect x="6" y="15" width="22" height="27" rx="2.5" fill="#7a3e1f" stroke="#3d1f0f" stroke-width="1.5"/>

  <!-- Coffee surface -->
  <rect x="7.5" y="15" width="19" height="2.5" fill="#3d1f0f"/>
  <ellipse cx="17" cy="15.5" rx="9" ry="0.6" fill="#c89968"/>

  <!-- Drop-bar handle -->
  <path d="M 28,19 L 33,19 Q 39,19 39,24 L 42,30 Q 42,38 36,38 L 28,38"
        fill="none" stroke="#3d1f0f" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Brake hood detail -->
  <circle cx="40" cy="22" r="1.3" fill="#3d1f0f"/>
</svg>
